      (function() {
        try {
          var curFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return curFetch; },
            set: function(v) { curFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var p = Object.getPrototypeOf(window);
            if (p) {
              var orig = window.fetch;
              Object.defineProperty(p, 'fetch', {
                get: function() { return orig; },
                set: function(v) { orig = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      })();
    </script>
